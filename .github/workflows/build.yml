name: Build

on:
  # 只在打 tag（发版）和 PR 时构建。
  # 推送 main 不触发——否则「推 main」和「推 tag」会在同一次发版里并行跑两条流水线，
  # 白跑一遍构建，还会让 release 步骤的产物来源变得不确定。
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate changelog entry
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [ -z "$VERSION" ]; then
            echo "mod_version is missing from gradle.properties" >&2
            exit 1
          fi
          if ! grep -Eq "^## ${VERSION}([[:space:]]|$)" CHANGELOG.md; then
            echo "CHANGELOG.md is missing an entry for version ${VERSION}" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${VERSION}" >&2
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew :cloudxmusic-client:build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudXmusic
          # 排除 sources jar：它带有未替换的 ${version} 且没有 class，装进 mods 会直接崩。
          path: |
            cloudxmusic-client/build/libs/*.jar
            !cloudxmusic-client/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Collect release jars
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          cp cloudxmusic-client/build/libs/CloudXMusic-*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist/

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { capture=1 }
            capture && /^## / && $0 !~ "^## " version "([[:space:]]|$)" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          body_path: release-notes.md